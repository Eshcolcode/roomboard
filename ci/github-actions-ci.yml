name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: e2e
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          QA_CHROME=$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))") node qa/qa.mjs
